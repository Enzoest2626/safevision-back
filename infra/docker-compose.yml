# SafeVision — stack completo para probar TODO localmente con Docker:
# Postgres + backend + MediaMTX + CV. Uso exclusivo de desarrollo/prueba —
# no tiene relacion con el deploy a AWS (ver infra/deploy.sh + README.md
# para eso, que usa CloudFormation, no docker-compose).
#
# Uso:
#   docker compose -f infra/docker-compose.yml up --build
#   (en otra terminal, para "encender la camara" una vez que todo esta arriba)
#   docker compose -f infra/docker-compose.yml run --rm camera-simulator
#
# Variables opcionales (crear infra/.env, ver infra/.env.example):
#   CV_REPO_PATH        ruta al repo safevision-computer-vision
#   ALERT_SERVICE_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: safevision
      POSTGRES_USER: safevision
      POSTGRES_PASSWORD: safevision
    volumes:
      - ../docs/init-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ../docs/seed-data.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safevision"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/safevision
      SPRING_R2DBC_USERNAME: safevision
      SPRING_R2DBC_PASSWORD: safevision
      ALERT_SERVICE_TOKEN: ${ALERT_SERVICE_TOKEN:-dev-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CV_RELOAD_URL: http://cv-app:8001/reload-params
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554"

  cv-app:
    build:
      context: ${CV_REPO_PATH:-../../safevision-computer-vision}
    # Igual que Restart=always en el systemd unit real (infra/cloudformation):
    # cuando el video termina y RTSP se desconecta de verdad (no un archivo
    # local, un stream real), el proceso termina — restart trae de vuelta
    # tanto el loop de deteccion (que reintenta conectar) como el servidor
    # del webhook (corre en un thread daemon del mismo proceso).
    restart: unless-stopped
    environment:
      VIDEO_SOURCE: rtsp://mediamtx:8554/obra1
      ALERT_SERVICE_URL: http://backend:8080/api/v1/incidents
      ALERT_SERVICE_TOKEN: ${ALERT_SERVICE_TOKEN:-dev-token}
      PARAMETERS_URL: http://backend:8080/api/v1/parameters
      SITE_ID: "1"
      SITE_NAME: Obra-Principal
      CAMERA_ID: CAM-01
      COOLDOWN_SECONDS: "10"
      MODEL_PATH: models/yolov11s/exp2/weights/best.pt
      RELOAD_SERVER_PORT: "8001"
    depends_on:
      - mediamtx
      - backend

  # Publica un video una vez (sin loop) al path /obra1 de MediaMTX — el
  # equivalente en local de simulate_camera.sh. No arranca con 'up', se
  # corre a mano cuando queres "encender la camara":
  #   docker compose -f infra/docker-compose.yml run --rm camera-simulator
  # Para usar obra2/obra3, sobreescribir el command al correrlo.
  camera-simulator:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    entrypoint: ["ffmpeg"]
    command: ["-re", "-i", "/videos/OBRA_REAL_1.mp4", "-c", "copy", "-f", "rtsp", "rtsp://mediamtx:8554/obra1"]
    volumes:
      - ${CV_REPO_PATH:-../../safevision-computer-vision}/tests/fixtures/video:/videos:ro
    depends_on:
      - mediamtx
    profiles: ["manual"]
