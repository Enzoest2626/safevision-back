AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SafeVision — demo en vivo. Crea RDS + 2 EC2 (backend, CV) con bootstrap
  100% automatico via UserData: instala Docker, hace pull de las imagenes ya
  publicadas en ECR (ver infra/deploy.sh, funcion do_build_and_push) y deja
  los servicios corriendo solos, sin SSH manual. Los repositorios ECR y los
  buckets S3 (assets: SQL + videos; evidencia: foto + clip de cada incidente)
  son recursos persistentes, fuera de este stack — solo compute (RDS + EC2)
  es efimero, pensado para crearse y borrarse por sesion de demo.

  Flujo que despliega (arquitectura actual, HTTP directo sin broker):
    CV  -> S3 (evidencia)  -> POST backend /api/v1/cv/incidents(/clips)
    backend -> URL prefirmada S3 -> Telegram
    backend -> POST CV :5001 /webhook/rules y /webhook/config (camera.ip_address)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC donde crear todo (usar la VPC default de la cuenta/region:
      aws ec2 describe-vpcs --filters Name=is-default,Values=true
      --query 'Vpcs[0].VpcId' --output text).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Subnet (dentro de VpcId) donde lanzar las 2 EC2. Cualquier subnet
      publica de la VPC default sirve (aws ec2 describe-subnets
      --filters Name=vpc-id,Values=<VpcId> --query 'Subnets[0].SubnetId'
      --output text).

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key pair EC2 ya existente, usada para SSH en ambas instancias.

  MyIpCidr:
    Type: String
    Description: Tu IP publica en formato CIDR (ej. 190.1.2.3/32) para SSH/Swagger.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  AssetsBucketName:
    Type: String
    Description: >
      Bucket S3 (ya existente, poblado con infra/deploy.sh upload) con
      sql/init-schema.sql, sql/seed-data.sql y videos/.

  EvidenceBucketName:
    Type: String
    Description: >
      Bucket S3 (ya existente, lo crea infra/deploy.sh con expiracion a 60
      dias) donde el CV sube la foto y el clip de cada incidente. El backend
      solo lee de aca para generar URLs prefirmadas.

  EcrBackendRepoName:
    Type: String
    Default: safevision-backend
    Description: Repositorio ECR (ya existente, poblado con infra/deploy.sh build) con la imagen del backend.

  EcrCvRepoName:
    Type: String
    Default: safevision-cv
    Description: Repositorio ECR (ya existente, poblado con infra/deploy.sh build) con la imagen del modulo CV.

  DbMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >
      Password del usuario safevision en RDS. Evitar comillas, backticks y
      signos $ — se usa dentro de un script bash en UserData.

  AlertServiceToken:
    Type: String
    NoEcho: true
    Description: Bearer token compartido entre el modulo CV y el backend (ingesta /api/v1/cv/**).

  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Firma de los JWT de /api/v1/auth/login (minimo 32 bytes).

  TelegramBotToken:
    Type: String
    NoEcho: true

  TelegramChatId:
    Type: String
    NoEcho: true

  CvWebhookPort:
    Type: Number
    Default: 5001
    Description: Puerto del webhook HTTP del CV (/webhook/rules, /webhook/config).

  CameraCode:
    Type: String
    Default: CAM-01
    Description: Codigo de la camara del seed (docs/seed-data.sql) que atiende la EC2 de CV.

  SiteName:
    Type: String
    Default: Obra-Principal
    Description: Nombre de la obra del seed (docs/seed-data.sql).

  LatestUbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Resuelto automaticamente al AMI de Ubuntu 24.04 LTS mas reciente en la region.

Resources:

  # ────────────────────────────────────────────────────────────
  # Security Groups
  # ────────────────────────────────────────────────────────────

  SgCV:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SafeVision - CV EC2
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
        - IpProtocol: tcp
          FromPort: 8554
          ToPort: 8554
          CidrIp: !Ref MyIpCidr
          Description: RTSP (mediamtx) - para publicar video desde tu maquina
      Tags:
        - Key: Name
          Value: sg-cv

  SgBackend:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SafeVision - Backend EC2
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref MyIpCidr
          Description: API + Swagger desde tu maquina
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !GetAtt SgCV.GroupId
          Description: Ingesta de incidentes desde el CV
      Tags:
        - Key: Name
          Value: sg-backend

  SgRds:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SafeVision - RDS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt SgBackend.GroupId
      Tags:
        - Key: Name
          Value: sg-rds

  # Regla aparte (no inline en SgCV) para evitar dependencia circular:
  # SgBackend ya referencia SgCV.GroupId inline, asi que SgCV no puede
  # referenciar SgBackend inline tambien.
  SgCVAllowBackendWebhook:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt SgCV.GroupId
      IpProtocol: tcp
      FromPort: !Ref CvWebhookPort
      ToPort: !Ref CvWebhookPort
      SourceSecurityGroupId: !GetAtt SgBackend.GroupId
      Description: Webhook del CV (reglas EPP + config de camara, backend a CV)

  # ────────────────────────────────────────────────────────────
  # IAM — un rol por instancia, cada uno con lo minimo que usa
  # ────────────────────────────────────────────────────────────

  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAssetsBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${AssetsBucketName}
                  - !Sub arn:aws:s3:::${AssetsBucketName}/*
        - PolicyName: ReadEvidenceForPresign
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Las URLs prefirmadas que recibe Telegram se firman con este rol:
              # solo funcionan si el rol puede leer el objeto.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${EvidenceBucketName}/*
        - PolicyName: DiscoverCvInstance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # wire-camera.sh busca la IP privada del CV por tags para guardarla
              # en cameras.ip_address. DescribeInstances no admite permisos por recurso.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
        - PolicyName: PullEcrImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrBackendRepoName}

  CvRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAssetsBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${AssetsBucketName}
                  - !Sub arn:aws:s3:::${AssetsBucketName}/*
        - PolicyName: WriteEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${EvidenceBucketName}/*
        - PolicyName: PullEcrImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrCvRepoName}

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BackendRole

  CvInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CvRole

  # ────────────────────────────────────────────────────────────
  # RDS
  # ────────────────────────────────────────────────────────────

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: safevision-db
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '16'
      MasterUsername: safevision
      MasterUserPassword: !Ref DbMasterPassword
      AllocatedStorage: '20'
      StorageType: gp3
      DBName: safevision
      VPCSecurityGroups:
        - !GetAtt SgRds.GroupId
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      MultiAZ: false

  # ────────────────────────────────────────────────────────────
  # EC2 Backend
  # ────────────────────────────────────────────────────────────

  BackendInstance:
    Type: AWS::EC2::Instance
    DependsOn: RDSInstance
    Properties:
      InstanceType: t3.medium
      ImageId: !Ref LatestUbuntuAmiId
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt SgBackend.GroupId
      IamInstanceProfile: !Ref BackendInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: safevision-backend
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/safevision-userdata.log 2>&1
          echo "=== SafeVision backend bootstrap: $(date) ==="

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg unzip postgresql-client

          echo "--- Instalando Docker ---"
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq docker-ce docker-ce-cli containerd.io
          usermod -aG docker ubuntu

          echo "--- Instalando AWS CLI v2 ---"
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          rm -rf /tmp/awscliv2.zip /tmp/aws

          echo "--- Login a ECR + pull de la imagen del backend ---"
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrBackendRepoName}:latest

          mkdir -p /opt/safevision /etc/safevision
          aws s3 cp s3://${AssetsBucketName}/sql/init-schema.sql /opt/safevision/init-schema.sql
          aws s3 cp s3://${AssetsBucketName}/sql/seed-data.sql /opt/safevision/seed-data.sql

          echo "Esperando a que RDS acepte conexiones..."
          until pg_isready -h ${RDSInstance.Endpoint.Address} -p 5432 -U safevision >/dev/null 2>&1; do
            sleep 5
          done
          echo "RDS disponible, cargando schema + seed..."

          export PGPASSWORD='${DbMasterPassword}'
          psql "host=${RDSInstance.Endpoint.Address} port=5432 dbname=safevision user=safevision sslmode=require" -v ON_ERROR_STOP=1 -f /opt/safevision/init-schema.sql
          psql "host=${RDSInstance.Endpoint.Address} port=5432 dbname=safevision user=safevision sslmode=require" -v ON_ERROR_STOP=1 -f /opt/safevision/seed-data.sql
          unset PGPASSWORD

          cat > /etc/safevision/backend.env <<ENVEOF
          SPRING_PROFILES_ACTIVE=prd
          SPRING_R2DBC_URL=r2dbc:postgresql://${RDSInstance.Endpoint.Address}:5432/safevision?sslMode=REQUIRE
          SPRING_R2DBC_USERNAME=safevision
          SPRING_R2DBC_PASSWORD=${DbMasterPassword}
          ALERT_SERVICE_TOKEN=${AlertServiceToken}
          JWT_SECRET=${JwtSecret}
          TELEGRAM_BOT_TOKEN=${TelegramBotToken}
          TELEGRAM_CHAT_ID=${TelegramChatId}
          S3_BUCKET=${EvidenceBucketName}
          AWS_REGION=${AWS::Region}
          CV_WEBHOOK_PORT=${CvWebhookPort}
          SERVER_PORT=8080
          TZ=America/Lima
          ENVEOF
          chmod 600 /etc/safevision/backend.env

          # Enlace backend -> CV: el backend le avisa al CV (reglas EPP, config de
          # camara) por HTTP a cameras.ip_address. La IP privada del CV no existe
          # hasta que su instancia arranca, asi que se busca por tags y se guarda
          # en la camara del seed. Tambien lo corre "./deploy.sh wire" como respaldo.
          cat > /opt/safevision/wire-camera.sh <<WIREEOF
          #!/bin/bash
          set -euo pipefail
          cv_ip=""
          for intento in \$(seq 1 60); do
            cv_ip=\$(aws ec2 describe-instances --region ${AWS::Region} \
              --filters "Name=tag:aws:cloudformation:stack-name,Values=${AWS::StackName}" \
                        "Name=tag:Name,Values=safevision-cv" \
                        "Name=instance-state-name,Values=pending,running" \
              --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
            if [ -n "\$cv_ip" ] && [ "\$cv_ip" != "None" ]; then break; fi
            echo "Esperando la IP privada del CV (intento \$intento/60)..."
            sleep 10
          done
          if [ -z "\$cv_ip" ] || [ "\$cv_ip" = "None" ]; then
            echo "No se encontro la instancia del CV — correr ./deploy.sh wire mas tarde"
            exit 1
          fi
          db_pass=\$(grep '^SPRING_R2DBC_PASSWORD=' /etc/safevision/backend.env | cut -d= -f2-)
          PGPASSWORD="\$db_pass" psql "host=${RDSInstance.Endpoint.Address} port=5432 dbname=safevision user=safevision sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "UPDATE cameras SET ip_address = '\$cv_ip', rtsp_url = 'rtsp://localhost:8554/obra1' WHERE code = '${CameraCode}';"
          echo "Camara ${CameraCode} enlazada al CV en \$cv_ip:${CvWebhookPort}"
          WIREEOF
          chmod 700 /opt/safevision/wire-camera.sh

          cat > /etc/systemd/system/safevision-back.service <<UNITEOF
          [Unit]
          Description=SafeVision Backend (Docker)
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          User=root
          EnvironmentFile=/etc/safevision/backend.env
          ExecStartPre=-/usr/bin/docker stop safevision-back
          ExecStartPre=-/usr/bin/docker rm safevision-back
          ExecStart=/usr/bin/docker run --rm --name safevision-back -p 8080:8080 --env-file /etc/safevision/backend.env ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrBackendRepoName}:latest
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNITEOF

          systemctl daemon-reload
          systemctl enable --now safevision-back

          /opt/safevision/wire-camera.sh || echo "wire-camera.sh fallo — correr ./deploy.sh wire"
          echo "=== SafeVision backend bootstrap terminado: $(date) ==="

  # ────────────────────────────────────────────────────────────
  # EC2 CV
  # ────────────────────────────────────────────────────────────

  CVInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: c6i.xlarge
      ImageId: !Ref LatestUbuntuAmiId
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt SgCV.GroupId
      IamInstanceProfile: !Ref CvInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: safevision-cv
      UserData:
        Fn::Base64:
          Fn::Join:
            - ''
            - - !Sub |
                #!/bin/bash
                set -euo pipefail
                exec > /var/log/safevision-userdata.log 2>&1
                echo "=== SafeVision CV bootstrap: $(date) ==="

                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq ca-certificates curl gnupg ffmpeg unzip

                echo "--- Instalando Docker ---"
                install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                chmod a+r /etc/apt/keyrings/docker.asc
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                  > /etc/apt/sources.list.d/docker.list
                apt-get update -qq
                apt-get install -y -qq docker-ce docker-ce-cli containerd.io
                usermod -aG docker ubuntu

                echo "--- Instalando AWS CLI v2 ---"
                curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                unzip -q /tmp/awscliv2.zip -d /tmp
                /tmp/aws/install
                rm -rf /tmp/awscliv2.zip /tmp/aws

                echo "--- Login a ECR + pull de las imagenes (CV + MediaMTX) ---"
                aws ecr get-login-password --region ${AWS::Region} \
                  | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrCvRepoName}:latest
                docker pull bluenviron/mediamtx:latest

                mkdir -p /home/ubuntu/videos
                aws s3 cp --recursive s3://${AssetsBucketName}/videos/ /home/ubuntu/videos/
                chown -R ubuntu:ubuntu /home/ubuntu/videos

              - |
                cat > /home/ubuntu/simulate_camera.sh <<'SCRIPTEOF'
                #!/bin/bash
                set -euo pipefail
                # El CV de esta instancia esta fijo a un solo path (VIDEO_SOURCE=.../obra1
                # en /etc/safevision/cv.env) -- los 3 videos de prueba comparten esa misma
                # conexion/camara, solo cambia el contenido publicado.
                NUM="${1:?Uso: simulate_camera.sh <1|2|3>}"
                VIDEO="$HOME/videos/OBRA_REAL_${NUM}.mp4"
                echo "Publicando $VIDEO en rtsp://localhost:8554/obra1 ..."
                ffmpeg -re -i "$VIDEO" -c copy -f rtsp "rtsp://localhost:8554/obra1"
                SCRIPTEOF
              - !Sub |
                chmod +x /home/ubuntu/simulate_camera.sh
                chown ubuntu:ubuntu /home/ubuntu/simulate_camera.sh

                mkdir -p /etc/safevision
                cat > /etc/safevision/cv.env <<ENVEOF
                VIDEO_SOURCE=rtsp://localhost:8554/obra1
                BACKEND_URL=http://${BackendInstance.PrivateIp}:8080
                ALERT_SERVICE_TOKEN=${AlertServiceToken}
                SITE_NAME=${SiteName}
                CAMERA_ID=${CameraCode}
                CV_WEBHOOK_PORT=${CvWebhookPort}
                MODEL_PATH=models/yolov11s/exp3/weights/best_int8_openvino_model
                CONFIDENCE_THRESHOLD=0.5
                COOLDOWN_SECONDS=30
                S3_BUCKET=${EvidenceBucketName}
                S3_PREFIX=incidents
                AWS_REGION=${AWS::Region}
                CLIP_ENABLED=true
                DISPLAY_WINDOW=false
                APP_ENV=prd
                TZ=America/Lima
                ENVEOF
                chmod 600 /etc/safevision/cv.env

                cat > /etc/systemd/system/mediamtx.service <<UNITEOF
                [Unit]
                Description=MediaMTX RTSP Server (Docker)
                After=network.target docker.service
                Requires=docker.service

                [Service]
                Type=simple
                User=root
                ExecStartPre=-/usr/bin/docker stop mediamtx
                ExecStartPre=-/usr/bin/docker rm mediamtx
                ExecStart=/usr/bin/docker run --rm --name mediamtx --network host bluenviron/mediamtx:latest
                Restart=always
                RestartSec=5

                [Install]
                WantedBy=multi-user.target
                UNITEOF

                cat > /etc/systemd/system/safevision-cv.service <<UNITEOF
                [Unit]
                Description=SafeVision CV Pipeline (Docker)
                After=network.target docker.service mediamtx.service
                Requires=docker.service

                [Service]
                Type=simple
                User=root
                EnvironmentFile=/etc/safevision/cv.env
                ExecStartPre=-/usr/bin/docker stop safevision-cv
                ExecStartPre=-/usr/bin/docker rm safevision-cv
                ExecStart=/usr/bin/docker run --rm --name safevision-cv --network host --env-file /etc/safevision/cv.env ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrCvRepoName}:latest
                Restart=always
                RestartSec=5

                [Install]
                WantedBy=multi-user.target
                UNITEOF

                systemctl daemon-reload
                systemctl enable --now mediamtx
                systemctl enable --now safevision-cv
                echo "=== SafeVision CV bootstrap terminado: $(date) ==="

  # ────────────────────────────────────────────────────────────
  # Elastic IPs
  # ────────────────────────────────────────────────────────────

  BackendEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref BackendInstance
      Tags:
        - Key: Name
          Value: eip-backend

  CVEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref CVInstance
      Tags:
        - Key: Name
          Value: eip-cv

Outputs:
  BackendPublicIP:
    Description: IP publica del backend.
    Value: !Ref BackendEIP

  SwaggerUrl:
    Description: Swagger UI (login en /api/v1/auth/login con el usuario del seed).
    Value: !Sub http://${BackendEIP}:8080/swagger-ui.html

  CVPublicIP:
    Description: IP publica de la EC2 de CV (SSH para correr simulate_camera.sh).
    Value: !Ref CVEIP

  BackendPrivateIP:
    Description: IP privada del backend (BACKEND_URL del CV).
    Value: !GetAtt BackendInstance.PrivateIp

  CVPrivateIP:
    Description: IP privada del CV (queda en cameras.ip_address de la camara del seed).
    Value: !GetAtt CVInstance.PrivateIp

  RDSEndpoint:
    Description: Endpoint del RDS (sin acceso publico, solo referencia).
    Value: !GetAtt RDSInstance.Endpoint.Address

  EvidenceBucket:
    Description: Bucket de evidencia (foto + clip de cada incidente).
    Value: !Ref EvidenceBucketName

  SSHBackendCommand:
    Value: !Sub ssh -i ${KeyPairName}.pem ubuntu@${BackendEIP}

  SSHCVCommand:
    Value: !Sub ssh -i ${KeyPairName}.pem ubuntu@${CVEIP}

  SimulateCameraCommand:
    Description: Comando para disparar la demo una vez conectado por SSH a la EC2 CV.
    Value: ./simulate_camera.sh 1
