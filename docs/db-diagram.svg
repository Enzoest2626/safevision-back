<svg viewBox="0 0 1080 760" xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5"
     role="img" width="1080" height="760">
  <title>SafeVision — Database Schema</title>

  <defs>
    <marker id="fk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1080" height="760" fill="#0f172a"/>

  <!-- ════════════════════════════════════════════════
       SITES
  ═════════════════════════════════════════════════ -->
  <rect x="20" y="20" width="215" height="175" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="20" y="20" width="215" height="30" rx="5" fill="#3b82f6"/>
  <rect x="20" y="44"  width="215" height="6"  fill="#3b82f6"/>
  <text x="127" y="41" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">sites</text>

  <rect x="28" y="60" width="16" height="10" rx="2" fill="#fbbf24"/>
  <text x="36" y="68" text-anchor="middle" fill="#0f172a" font-size="8.5" font-weight="700">PK</text>
  <text x="50" y="68" fill="#e2e8f0">id           UUID</text>

  <text x="28" y="84" fill="#e2e8f0">   name         VARCHAR(100)</text>
  <text x="28" y="99" fill="#e2e8f0">   location     VARCHAR(200)</text>
  <text x="28" y="114" fill="#e2e8f0">   active       BOOLEAN</text>

  <line x1="28" y1="121" x2="227" y2="121" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="28" y="136" fill="#64748b">   created_at   TIMESTAMP</text>
  <text x="28" y="151" fill="#64748b">   created_by   VARCHAR(100)</text>
  <text x="28" y="166" fill="#64748b">   updated_at   TIMESTAMP</text>
  <text x="28" y="181" fill="#64748b">   updated_by   VARCHAR(100)</text>

  <!-- ════════════════════════════════════════════════
       CAMERAS
  ═════════════════════════════════════════════════ -->
  <rect x="265" y="20" width="230" height="207" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="265" y="20" width="230" height="30" rx="5" fill="#3b82f6"/>
  <rect x="265" y="44"  width="230" height="6"  fill="#3b82f6"/>
  <text x="380" y="41" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">cameras</text>

  <rect x="273" y="60" width="16" height="10" rx="2" fill="#fbbf24"/>
  <text x="281" y="68" text-anchor="middle" fill="#0f172a" font-size="8.5" font-weight="700">PK</text>
  <text x="295" y="68" fill="#e2e8f0">id         UUID</text>

  <rect x="273" y="75" width="16" height="10" rx="2" fill="#f97316"/>
  <text x="281" y="83" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="700">FK</text>
  <text x="295" y="83" fill="#e2e8f0">site_id    UUID</text>

  <text x="273" y="99"  fill="#e2e8f0">   code       VARCHAR(50)</text>
  <text x="273" y="114" fill="#e2e8f0">   name       VARCHAR(100)</text>
  <text x="273" y="129" fill="#e2e8f0">   ip_address VARCHAR(50)</text>
  <text x="273" y="144" fill="#e2e8f0">   rtsp_url   VARCHAR(300)</text>
  <text x="273" y="159" fill="#e2e8f0">   active     BOOLEAN</text>

  <line x1="273" y1="166" x2="487" y2="166" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="273" y="181" fill="#64748b">   created_at / created_by</text>
  <text x="273" y="196" fill="#64748b">   updated_at / updated_by</text>
  <text x="273" y="211" fill="#64748b">   (TIMESTAMP / VARCHAR)</text>

  <!-- ════════════════════════════════════════════════
       WORKERS
  ═════════════════════════════════════════════════ -->
  <rect x="525" y="20" width="230" height="223" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="525" y="20" width="230" height="30" rx="5" fill="#3b82f6"/>
  <rect x="525" y="44"  width="230" height="6"  fill="#3b82f6"/>
  <text x="640" y="41" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">workers</text>

  <rect x="533" y="60" width="16" height="10" rx="2" fill="#fbbf24"/>
  <text x="541" y="68" text-anchor="middle" fill="#0f172a" font-size="8.5" font-weight="700">PK</text>
  <text x="555" y="68" fill="#e2e8f0">id         UUID</text>

  <rect x="533" y="75" width="16" height="10" rx="2" fill="#f97316"/>
  <text x="541" y="83" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="700">FK</text>
  <text x="555" y="83" fill="#e2e8f0">site_id    UUID</text>

  <text x="533" y="99"  fill="#e2e8f0">   code       INTEGER</text>
  <text x="533" y="114" fill="#e2e8f0">   first_name VARCHAR(100)</text>
  <text x="533" y="129" fill="#e2e8f0">   last_name  VARCHAR(100)</text>
  <text x="533" y="144" fill="#e2e8f0">   role       VARCHAR(100)</text>
  <text x="533" y="159" fill="#e2e8f0">   active     BOOLEAN</text>

  <line x1="533" y1="166" x2="747" y2="166" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="533" y="181" fill="#64748b">   created_at / created_by</text>
  <text x="533" y="196" fill="#64748b">   updated_at / updated_by</text>
  <text x="533" y="211" fill="#64748b">   (TIMESTAMP / VARCHAR)</text>

  <!-- ════════════════════════════════════════════════
       USERS
  ═════════════════════════════════════════════════ -->
  <rect x="785" y="20" width="270" height="223" rx="5" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="785" y="20" width="270" height="30" rx="5" fill="#8b5cf6"/>
  <rect x="785" y="44"  width="270" height="6"  fill="#8b5cf6"/>
  <text x="920" y="41" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">users</text>

  <rect x="793" y="60" width="16" height="10" rx="2" fill="#fbbf24"/>
  <text x="801" y="68" text-anchor="middle" fill="#0f172a" font-size="8.5" font-weight="700">PK</text>
  <text x="815" y="68" fill="#e2e8f0">id               UUID</text>

  <text x="793" y="84"  fill="#e2e8f0">   username         VARCHAR(100)</text>
  <text x="793" y="99"  fill="#e2e8f0">   email            VARCHAR(200)</text>
  <text x="793" y="114" fill="#e2e8f0">   password_hash    VARCHAR(300)</text>
  <text x="793" y="129" fill="#e2e8f0">   role             VARCHAR(50)</text>
  <text x="793" y="144" fill="#64748b">   telegram_chat_id VARCHAR(100)</text>
  <text x="793" y="159" fill="#e2e8f0">   active           BOOLEAN</text>

  <line x1="793" y1="166" x2="1047" y2="166" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="793" y="181" fill="#64748b">   created_at / created_by</text>
  <text x="793" y="196" fill="#64748b">   updated_at / updated_by</text>
  <text x="793" y="211" fill="#64748b">   (TIMESTAMP / VARCHAR)</text>

