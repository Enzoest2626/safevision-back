spring:
  application:
    name: safevision-back
  profiles:
    active: dev
  codec:
    max-in-memory-size: 10MB
  webflux:
    base-path: /api/v1

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.safevision: DEBUG
    org.springframework.r2dbc: INFO
