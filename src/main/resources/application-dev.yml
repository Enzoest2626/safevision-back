spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/safevision}
    username: ${SPRING_R2DBC_USERNAME:safevision}
    password: ${SPRING_R2DBC_PASSWORD:safevision}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

mqtt:
  broker-host: ${MQTT_BROKER_HOST:}
  broker-port: ${MQTT_BROKER_PORT:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  client-id: ${MQTT_CLIENT_ID:}

s3:
  bucket: ${S3_BUCKET:}
  region: ${AWS_REGION:us-east-1}
  presign-ttl-minutes: ${S3_PRESIGN_TTL_MINUTES:15}

app:
  security:
    alert-service-token: ${ALERT_SERVICE_TOKEN:dev-token}
    jwt-secret: ${JWT_SECRET:change-me-safevision-dev-secret-minimum-32-bytes-long}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
