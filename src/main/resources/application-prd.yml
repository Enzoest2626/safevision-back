# PRODUCCIÓN — nunca commitear con valores reales
spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  chat-id: ${TELEGRAM_CHAT_ID}

s3:
  bucket: ${S3_BUCKET}
  region: ${AWS_REGION:us-east-1}
  presign-ttl-minutes: ${S3_PRESIGN_TTL_MINUTES:15}

app:
  cv:
    webhook-port: ${CV_WEBHOOK_PORT:5001}
    webhook-timeout-seconds: ${CV_WEBHOOK_TIMEOUT_SECONDS:5}
  telegram:
    linking-poll-interval-ms: ${TELEGRAM_LINKING_POLL_INTERVAL_MS:900000}
  reports:
    daily-enabled: ${REPORTS_DAILY_ENABLED:false}
    daily-cron: ${REPORTS_DAILY_CRON:0 55 23 * * *}
  security:
    alert-service-token: ${ALERT_SERVICE_TOKEN}
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.safevision: INFO
    org.springframework.r2dbc: WARN
