name: CI (develop)

# Solo develop y solo codigo: infra/ no dispara el pipeline
# (despliegue CloudFormation de infra/ sigue manual con deploy.sh).
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + unitarios + integracion
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Formato y analisis estatico (no bloquean)
        if: always()
        run: ./mvnw -B spotless:check checkstyle:check spotbugs:check

      - name: Reportes de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secretos hardcodeados)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: safevision-back:ci

      - name: Trivy imagen (CRITICAL,HIGH bloquean)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: safevision-back:ci
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem (deps Java + Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
