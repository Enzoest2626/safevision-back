name: CI

# Homogeneo con safevision-front y safevision-computer-vision:
# mismos triggers, mismo runner, mismos roles de job (guards / lint+format /
# test / security / docker-build) y `guards` como unico lugar con las reglas
# no negociables de AGENTS.md.
#
# develop / release / main. infra/ no dispara el pipeline
# (despliegue CloudFormation de infra/ sigue manual con deploy.sh).
on:
  push:
    branches: [develop, release, main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [develop, release, main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Reglas no negociables de AGENTS.md (verificables en el PR) ─────────
  guards:
    name: guards
    # Pipeline pesado solo en develop (y en push). Los PRs de promoción
    # (develop -> release -> main) no lo repiten: develop ya lo validó.
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reglas del repo (AGENTS.md)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          RANGE="$BASE...HEAD"
          echo "Rango evaluado: $RANGE"

          echo "== 1/4: sin firma de IA en los mensajes =="
          if git log "$RANGE" --format=%B | grep -iE 'Co-authored-by.*(Codex|Claude)|Generated with (Codex|Claude Code)'; then
            echo "::error::Mensajes con firma de IA (prohibido por AGENTS.md)."
            exit 1
          fi

          echo "== 2/4: commits convencionales =="
          # Commits previos a la adopcion de este guard, ya pusheados —
          # AGENTS.md prohibe reescribir historial, asi que se omiten.
          # (8b9bf44: "checkpoint: backend en HTTP puro ...", 2026-08-25)
          LEGACY="8b9bf44"
          FAILED=0
          while IFS=$'\t' read -r sha subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge*) continue ;;
            esac
            case " $LEGACY " in *" $sha "*) echo "omitido (legacy): $sha $subject"; continue ;; esac
            if ! echo "$subject" | grep -qE '^(feat|fix|docs|refactor|test|chore|exp|perf|ci|style)(\+(feat|fix|docs|refactor|test|chore|exp|perf|ci|style))*(\(.+\))?: .+'; then
              echo "::error::Commit fuera de formato: $subject"
              FAILED=1
            fi
          done < <(git log "$RANGE" --format="%h%x09%s")
          [ "$FAILED" = "1" ] && exit 1

          echo "== 3/4: sin .env ni .pem en el PR =="
          if git diff --name-only --diff-filter=ACMRT "$RANGE" | grep -xE '\.env'; then
            echo "::error::El PR incluye .env (prohibido: secretos solo en local)."
            exit 1
          fi
          if git diff --name-only --diff-filter=ACMRT "$RANGE" | grep -E '\.pem$'; then
            echo "::error::El PR incluye un .pem (prohibido)."
            exit 1
          fi

          echo "== 4/4: espejo AGENTS.md <-> CLAUDE.md =="
          CHANGED=$(git diff --name-only "$RANGE")
          echo "$CHANGED" | grep -qx 'AGENTS.md' && HAS_AGENTS=1 || HAS_AGENTS=0
          echo "$CHANGED" | grep -qx 'CLAUDE.md' && HAS_CLAUDE=1 || HAS_CLAUDE=0
          if [ "$HAS_AGENTS" != "$HAS_CLAUDE" ]; then
            echo "::error::AGENTS.md y CLAUDE.md deben actualizarse juntos (archivos espejo)."
            exit 1
          fi

          echo "Guards OK."

  # ── Titulo semantico del PR ────────────────────────────────────────────
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # feat(HU10): ..., feat(sites): ..., docs(...): ..., fix, chore, refactor, test
          types: |
            feat
            fix
            docs
            chore
            refactor
            test

  # ── Build + lint + format + tests + cobertura ──────────────────────────
  build-test:
    name: build-test
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify incluye jacoco:check (LINE 70%, BRANCH 60% bloquean).
      # Local sigue leniente: checkstyle/spotbugs con fail=false en pom.xml.
      - name: Build + unitarios + integracion + cobertura
        run: chmod +x mvnw && ./mvnw -B verify

      # En CI el formato y el analisis estatico si bloquean el PR,
      # sin cambiar el comportamiento local (override por CLI).
      - name: Formato y analisis estatico (bloquean en CI)
        run: ./mvnw -B spotless:check -Dcheckstyle.failOnViolation=true -Dspotbugs.failOnError=true

      - name: Resumen cobertura
        if: always()
        run: |
          awk -F',' 'NR>1{im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9} END{printf "LINE %.1f%% | BRANCH %.1f%%\n", lc/(lc+lm)*100, bc/(bc+bm)*100}' target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reportes de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ── Escaneo de secretos ────────────────────────────────────────────────
  secrets-scan:
    name: secrets-scan
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks comenta el hallazgo en el PR (gratis)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks (secretos hardcodeados)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Imagen Docker (ultimo: solo si lo anterior paso) ───────────────────
  docker-build:
    name: docker-build
    # Ultimo en correr: solo si build-test y secrets-scan pasaron.
    # (pr-title no se incluye porque en push se salta y arrastraria este job con el.)
    # No quemar minutos en drafts. Solo valida que la imagen construye, sin push.
    # Solo en develop y en push (los PRs de promoción no repiten el pipeline),
    # y nunca en drafts. Corre ultimo y solo valida que la imagen construye.
    if: (github.event_name != 'pull_request' || github.base_ref == 'develop') && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-test, secrets-scan]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: safevision-back:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Guardia de promocion (unico check requerido en release/main) ───────
  # GitHub no restringe la rama de origen de un PR de forma nativa, asi que
  # se valida aca: release solo acepta PRs desde develop, main solo desde
  # release. Los rulesets de release/main exigen unicamente este check.
  promotion-guard:
    name: promotion-guard
    if: github.event_name == 'pull_request' && (github.base_ref == 'release' || github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validar rama de origen
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          case "$BASE" in
            release) EXPECTED="develop" ;;
            main)    EXPECTED="release" ;;
            *) echo "::error::Rama base inesperada: $BASE"; exit 1 ;;
          esac
          if [ "$HEAD" != "$EXPECTED" ]; then
            echo "::error::Solo '$EXPECTED' puede promoverse a '$BASE' (recibido: '$HEAD')."
            exit 1
          fi
          echo "Promocion $HEAD -> $BASE OK."
